name: Release

# Push a version tag to cut a release:
#   npm version minor        # bumps package.json, commits, tags v0.2.0
#   git push --follow-tags
# Tags with a pre-release suffix (v0.2.0-rc.1) become GitHub pre-releases.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

  test:
    name: Test
    needs: verify
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.platform }})
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Signing is optional: without the secrets the installers are built unsigned.
      # The variables are only exported when set, because electron-builder treats
      # an empty CSC_LINK as a certificate and fails.
      - name: Configure code signing
        shell: bash
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          set_env() {
            { echo "$1<<__KUMI_EOF__"; echo "$2"; echo "__KUMI_EOF__"; } >> "$GITHUB_ENV"
          }
          case "$RUNNER_OS" in
            macOS)
              if [ -z "$MAC_CSC_LINK" ]; then
                # Ad-hoc sign instead: Apple silicon refuses to run code without a
                # valid signature. Hardened runtime only matters for notarization,
                # which an ad-hoc build can't get.
                set_env MAC_ADHOC_SIGN true
                echo "::warning::MAC_CSC_LINK is not set: the macOS build is ad-hoc signed and not notarized."
                exit 0
              fi
              set_env CSC_LINK "$MAC_CSC_LINK"
              set_env CSC_KEY_PASSWORD "$MAC_CSC_KEY_PASSWORD"
              if [ -n "$APPLE_ID" ]; then
                set_env APPLE_ID "$APPLE_ID"
                set_env APPLE_APP_SPECIFIC_PASSWORD "$APPLE_APP_SPECIFIC_PASSWORD"
                set_env APPLE_TEAM_ID "$APPLE_TEAM_ID"
              else
                echo "::warning::APPLE_ID is not set: the macOS build is signed but not notarized."
              fi
              ;;
            Windows)
              if [ -z "$WIN_CSC_LINK" ]; then
                echo "::warning::WIN_CSC_LINK is not set: the Windows installer is unsigned."
                exit 0
              fi
              set_env WIN_CSC_LINK "$WIN_CSC_LINK"
              set_env WIN_CSC_KEY_PASSWORD "$WIN_CSC_KEY_PASSWORD"
              ;;
          esac

      - run: npm run build
      # Publishing happens in the release job, once every platform has built.
      - name: Package
        shell: bash
        run: |
          args=(--${{ matrix.platform }} --publish never)
          if [ "${MAC_ADHOC_SIGN:-}" = true ]; then
            args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          npx electron-builder "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          # A re-run after a partial failure updates the existing release instead of failing.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            exit 0
          fi
          flags=()
          if [[ "$version" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$tag" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kumi $version" \
            --generate-notes \
            --verify-tag \
            "${flags[@]}"
