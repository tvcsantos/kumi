name: Release

# Push a version tag to cut a release:
#   npm run release -- minor   # bumps package.json, commits, tags v0.2.0
#   git push --follow-tags
# Tags with a pre-release suffix (v0.2.0-rc.1) become GitHub pre-releases.
#
# To mark a release important or required, use `npm run release:required -- patch "reason"`
# (or release:important). It adds trailers to the (annotated) tag's message:
#   Kumi-Update: required                     # or important
#   Kumi-Update-Reason: Fixes a token leak    # optional, one line
#   Kumi-Update-Platforms: windows            # optional: mac, windows, linux; all when left out
# Every release's notes start with hidden lines listing the requirements still in force: the
# previous release's lines plus this tag's, pruned. Kumi reads them. See scripts/release-levels.mjs.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      levels: ${{ steps.tag.outputs.levels }}
    steps:
      - uses: actions/checkout@v7
      - name: Check the tag
        id: tag
        uses: actions/github-script@v9
        with:
          script: |
            const fs = await import('node:fs/promises');
            const levels = await import(`${process.env.GITHUB_WORKSPACE}/scripts/release-levels.mjs`);
            const tag = context.ref.replace('refs/tags/', '');

            const packageJson = await fs.readFile('package.json', 'utf8');
            const { version } = JSON.parse(packageJson);

            if (`v${version}` !== tag) {
              return core.setFailed(`Tag ${tag} does not match package.json version ${version}`);
            }

            // This tag's own level is in its message; a lightweight tag has none.
            // Checked here, so a bad trailer fails the release before anything is built.
            const added = [];
            const { data: ref } = await github.rest.git.getRef(
              { ...context.repo, ref: `tags/${tag}` }
            );

            if (ref.object.type === 'tag') {
              const { data: annotated } = await github.rest.git.getTag(
                { ...context.repo, tag_sha: ref.object.sha }
              );
              const trailers = levels.readTrailers(annotated.message);
              const error = levels.levelError(trailers);

              if (error) {
                return core.setFailed(`Kumi-Update trailers: ${error}`);
              }

              if (trailers.level) {
                added.push({ ...trailers, version, platforms: trailers.platforms?.split(',') });
              }
            }

            // Carry forward what the previous release lists, so the newest release always holds every requirement.
            const { data: list } = await github.rest.repos.listReleases(
              { ...context.repo, per_page: 100 }
            );

            const releases = list.map((r) => ({
              version: r.tag_name.replace(/^v/, ''),
              draft: r.draft,
              body: r.body,
              tag: r.tag_name,
            }));
            
            const previous = levels.previousRelease(releases, version);
            const previousLines = levels.parseLevelLines(previous?.body);
            const carried = levels.carryLevels(previousLines, added);
            const lines = levels.formatLevelLines(carried);

            core.info(`Carried from: ${previous?.tag ?? 'none'}`);
            core.info(lines ? `Update levels:\n${lines}` : 'No update levels.');

            core.setOutput('levels', lines);

  test:
    name: Test
    needs: verify
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.platform }})
    needs: test
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Signing is optional: without the secrets the installers are built unsigned.
      # The variables are only exported when set, because electron-builder treats
      # an empty CSC_LINK as a certificate and fails.
      - name: Configure code signing
        uses: actions/github-script@v9
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        with:
          script: |
            const { 
              RUNNER_OS, 
              MAC_CSC_LINK, 
              MAC_CSC_KEY_PASSWORD, 
              APPLE_ID, 
              APPLE_APP_SPECIFIC_PASSWORD, 
              APPLE_TEAM_ID, 
              WIN_CSC_LINK, 
              WIN_CSC_KEY_PASSWORD 
            } = process.env;

            switch (RUNNER_OS) {
              case 'macOS':
                if (!MAC_CSC_LINK) {
                  // Ad-hoc sign instead: Apple silicon refuses to run code without a valid signature.
                  // Hardened runtime only matters for notarization, which an ad-hoc build can't get.
                  core.exportVariable('MAC_ADHOC_SIGN', 'true');
                  core.warning('MAC_CSC_LINK is not set: the macOS build is ad-hoc signed and not notarized.');
                  return;
                }
                core.exportVariable('CSC_LINK', MAC_CSC_LINK);
                core.exportVariable('CSC_KEY_PASSWORD', MAC_CSC_KEY_PASSWORD);
                if (APPLE_ID) {
                  core.exportVariable('APPLE_ID', APPLE_ID);
                  core.exportVariable('APPLE_APP_SPECIFIC_PASSWORD', APPLE_APP_SPECIFIC_PASSWORD);
                  core.exportVariable('APPLE_TEAM_ID', APPLE_TEAM_ID);
                } else {
                  core.warning('APPLE_ID is not set: the macOS build is signed but not notarized.');
                }
                break;
              case 'Windows':
                if (!WIN_CSC_LINK) {
                  core.warning('WIN_CSC_LINK is not set: the Windows installer is unsigned.');
                  return;
                }
                core.exportVariable('WIN_CSC_LINK', WIN_CSC_LINK);
                core.exportVariable('WIN_CSC_KEY_PASSWORD', WIN_CSC_KEY_PASSWORD);
                break;
            }

      - run: npm run build
      # Publishing happens in the release job, once every platform has built.
      - name: Package
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          args=("--$PLATFORM" --publish never)
          if [ "${MAC_ADHOC_SIGN:-}" = true ]; then
            args+=(-c.mac.identity=- -c.mac.hardenedRuntime=false)
          fi
          npx electron-builder "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: Publish GitHub release
    needs: [verify, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - name: Create release
        uses: actions/github-script@v9
        env:
          LEVELS: ${{ needs.verify.outputs.levels }}
        with:
          script: |
            const fs = await import('node:fs/promises');
            const tag = context.ref.replace('refs/tags/', '');
            const version = tag.replace(/^v/, '');
            const levels = process.env.LEVELS;
            const repo = context.repo;

            // A re-run after a partial failure finds the release the first run created (maybe still a draft).
            const { data: releases } = await github.rest.repos.listReleases(
              { ...repo, per_page: 30 }
            );

            let release = releases.find((r) => r.tag_name === tag);
            const releaseBody = release?.body ?? '';

            if (!release) {
              // A draft until every file is up, so Kumi never sees a release with files missing.
              // GitHub puts `body` above the generated notes.
              ({ data: release } = await github.rest.repos.createRelease({
                ...repo,
                tag_name: tag,
                name: `Kumi ${version}`,
                body: levels || undefined,
                generate_release_notes: true,
                prerelease: version.includes('-'),
                draft: true,
              }));
            } else if (levels && !releaseBody.includes(levels)) {
              await github.rest.repos.updateRelease({
                ...repo,
                release_id: release.id,
                body: `${levels}\n\n${releaseBody}`,
              });
            }

            for (const name of await fs.readdir('dist')) {
              const old = release.assets.find((a) => a.name === name);
              if (old) {
                await github.rest.repos.deleteReleaseAsset(
                  { ...repo, asset_id: old.id }
                );
              }

              core.info(`Uploading ${name}`);

              const data = await fs.readFile(`dist/${name}`);

              await github.rest.repos.uploadReleaseAsset({
                ...repo,
                release_id: release.id,
                name,
                data,
                headers: { 
                  'content-type': 'application/octet-stream', 
                  'content-length': data.length 
                },
              });
            }

            if (release.draft) {
              ({ data: release } = await github.rest.repos.updateRelease(
                { ...repo, release_id: release.id, draft: false }
              ));
            }

            core.info(`Published ${release.html_url}`);
