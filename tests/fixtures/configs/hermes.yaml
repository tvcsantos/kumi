# Hermes Agent config
model:
  default: "anthropic/claude-opus-5-5"
  provider: openrouter

# MCP servers
mcp_servers:
  github:
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-github"]
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "ghp_x"  # rotate monthly
    tools:
      include: [list_issues, create_issue]

  # Hosted
  linear:
    url: "https://mcp.linear.app/mcp"
    auth: oauth

# Terminal backend
terminal:
  backend: local
