appId: dev.tvcsantos.kumi
productName: Kumi
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.developer-tools
  # Always name the arch, so the Intel and Apple silicon downloads are told apart.
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Development
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # No spaces: GitHub renames uploaded assets with spaces, which would break
  # the download URLs in latest.yml.
  artifactName: ${productName}-Setup-${version}.${ext}
publish:
  provider: github
  owner: tvcsantos
  repo: kumi
