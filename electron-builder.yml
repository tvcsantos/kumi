appId: dev.tvcsantos.kumi
productName: Kumi
directories:
  buildResources: build
  output: dist
files:
  - out/**
  - package.json
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
win:
  target: [nsis]
linux:
  target: [AppImage, deb]
  category: Development
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
publish:
  provider: github
  owner: tvcsantos
  repo: kumi
